const GREETINGS=[{main:n=>`${n}, 오늘은 어떤 게 어려워?`,sub:'정리되지 않은 질문이어도 괜찮아. 같이 하나씩 살펴보자.'},{main:n=>`${n}, 무슨 고민 있어?`,sub:'실무든 회사생활이든, 편하게 얘기해봐.'},{main:n=>`${n}, 뭐 하나 물어보려고?`,sub:'다시 묻는 것도 괜찮아. 어디가 헷갈렸는지 같이 보자.'},{main:n=>`${n}, 오늘 헷갈린 게 있었어?`,sub:'바로 답을 찾지 않아도 돼. 어떤 상황인지부터 들어볼게.'},{main:n=>`${n}, 잠깐 이야기할까?`,sub:'사수한테 묻기 망설여졌던 것도 여기서는 편하게.'},{main:n=>`${n}, 어떤 얘기부터 해볼까?`,sub:'작은 질문이어도 괜찮아. 하나씩 같이 정리해보자.'}];
const STARTERS={practice:['원천세 신고를 잘못한 것 같아요.','처음 맡는 업무인데 어디부터 확인할까요?'],client:['자료를 요청했는데 답이 없어요.','거래처에 실수한 내용을 어떻게 말하죠?'],senior:['같은 걸 또 물어봐도 될까요?','사수가 설명해줬는데 이해가 안 돼요.'],worry:['오늘은 좀 지쳤어요.','이 일을 계속해도 될지 모르겠어요.']};
const $=s=>document.querySelector(s);const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]||ICONS.chat}</svg>`;
const uid=()=>globalThis.crypto?.randomUUID?.()||`id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,12)}`;
const now=()=>new Date().toISOString();const ago=d=>new Date(Date.now()-d*86400000).toISOString();
const fmt=(d,opts={month:'long',day:'numeric'})=>{try{return new Intl.DateTimeFormat('ko-KR',opts).format(new Date(d))}catch{return '날짜 확인 필요'}};
const monthKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`};
const plain=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').split(/\n\n+/).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
const emptyState=()=>({version:APP_VERSION,profile:null,conversations:[],consultations:[],reflections:[],drafts:[],notifications:[],flags:FEATURE_FLAGS});
let storageAvailable=true;let state=load();let view=state.profile?'home':'onboarding';let activeConversation=null;let activeConsultation=null;let activeAdmin=null;let adminTab='requests';let historyFilter='all';let historySearch='';let historyFavoritesOnly=false;let consultationFilter='all';let chosenCareer='1년 차';let growthMonth='all';let modalOpener=null;let toastTimer;let greetingIndex=Number.isInteger(state.lastGreetingIndex)?state.lastGreetingIndex:-1;
const inputDrafts={home:'',chat:{},consult:{}};let nextChatScroll='end';
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return emptyState();const x=JSON.parse(raw);if(x.version!==APP_VERSION||!Array.isArray(x.conversations)||!Array.isArray(x.consultations)||!Array.isArray(x.reflections)||!Array.isArray(x.drafts)||!Array.isArray(x.notifications))return emptyState();if(x.profile&&typeof x.profile.nickname!=='string')return emptyState();return x}catch{storageAvailable=false;return emptyState()}}
function save(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageAvailable=true;return true}
  catch{storageAvailable=false;toast('이 브라우저에 저장하지 못했어. 입력한 내용은 열려 있는 화면에서 다시 확인해줘.');return false}
}

function nickname(){return state.profile?.nickname||'엠버'}
function toast(text){clearTimeout(toastTimer);$('#toast-root').innerHTML=`<div class="toast">${esc(text)}</div>`;toastTimer=setTimeout(()=>$('#toast-root').innerHTML='',4200)}
function chooseGreeting(){
  const n=GREETINGS.length;let i=Math.floor(Math.random()*n);
  if(i===greetingIndex)i=(i+1)%n;greetingIndex=i;
  if(state.profile){state.lastGreetingIndex=i;save()}
}

function go(next,id){
  captureInputs();
  if(next==='home'&&view!=='home')chooseGreeting();
  if(next==='chat'){activeConversation=id||activeConversation;nextChatScroll='end'}
  if(next==='consult-detail')activeConsultation=id;
  if(next==='admin')activeAdmin=id||activeAdmin;
  view=next;closeDialog();render();window.scrollTo({top:0,behavior:'instant'});
  $('#main')?.focus({preventScroll:true});
}
function captureInputs(){
  if($('#home-question'))inputDrafts.home=$('#home-question').value;
  if($('#chat-input')&&activeConversation)inputDrafts.chat[activeConversation]=$('#chat-input').value;
}
function resizeInput(el){
  if(!el)return;el.style.height='49px';el.style.height=Math.min(el.scrollHeight,130)+'px';
}
function restoreInputs(){
  const home=$('#home-question'),chat=$('#chat-input');
  if(home){home.value=inputDrafts.home;resizeInput(home)}
  if(chat){chat.value=inputDrafts.chat[activeConversation]||'';resizeInput(chat)}
}
function updateShareReview(){
  const form=$('#request-form');if(!form)return;
  const summary=$('#request-summary').value;
  const ids=$$('input[name="shared"]:checked').map(x=>x.value);
  inputDrafts.consult[form.dataset.conversationId]={summary,ids};
  const count=$('#shared-count');if(count)count.textContent=ids.length?'추가로 선택한 대화 '+ids.length+'개도 함께 공유해.':'추가 대화 없이, 위 요약과 닉네임·경력만 공유해.';
  const submit=$('#request-submit');if(submit)submit.disabled=!summary.trim()||!$('#share-consent').checked;
}

function brand(){return `<div class="brand"><div class="brand-mark" aria-hidden="true">선</div><div><div class="brand-name">선물</div><div class="brand-sub">선배에게 물어봐</div></div></div>`}
function plantMark(){const stage=Math.max(0,CAREERS.indexOf(state.profile?.career));let shapes='';if(stage<2){shapes=`<path d="M24 37V${stage?19:25}" stroke="#7e8b62" stroke-width="2.2" stroke-linecap="round"/><path d="M24 27C11 29 11 16 12 16c10-1 15 4 12 11" fill="#a0b284"/><path d="M24 23c0-10 7-13 13-11 0 9-5 14-13 11" fill="#6e9169"/>${stage?'<path d="M24 32c7 1 11-2 12-8-8-1-12 2-12 8" fill="#becb9f"/>':''}`;}else{shapes=`<path d="M24 39V20M24 32l-7-8M24 29l7-8" stroke="#9b9270" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="24" cy="18" rx="${stage===2?11:15}" ry="${stage===2?12:14}" fill="#8fa67b"/><circle cx="17" cy="19" r="9" fill="#a7ba8b"/><circle cx="30" cy="19" r="${stage===4?11:9}" fill="#77986d"/>${stage===4?'<circle cx="31" cy="17" r="2" fill="#bf9572"/><circle cx="18" cy="20" r="2" fill="#bf9572"/>':''}`;}return `<svg viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="40" rx="12" ry="2.2" fill="#dae2ca"/>${shapes}</svg>`}
function nicknameCard(){return `<button class="nickname-card" data-action="profile" aria-label="${esc(nickname())} 프로필 수정"><div class="profile-plant">${plantMark()}</div><div><strong>${esc(nickname())}</strong><span>세무사무소 ${esc(state.profile?.career==='이제 막 시작했어'?'입문':state.profile?.career||'')}</span></div>${icon('edit')}</button>`}
function shell(body,chat=false){const routes=[['home','home','홈'],['history','chat','내 대화'],['consultations','people','선배 상담'],['growth','book','성장기록']];const navActive=r=>r==='home'?['home','chat'].includes(view):r==='consultations'?['consultations','consult-detail'].includes(view):view===r;const pending=state.consultations.filter(c=>c.status==='requested').length;const unread=state.notifications.filter(n=>!n.read).length;return `<aside class="sidebar">${brand()}<nav class="nav" aria-label="주요 메뉴">${routes.map(([r,i,t])=>`<button class="nav-item ${navActive(r)?'active':''}" data-view="${r}" ${navActive(r)?'aria-current="page"':''}>${icon(i)}${t}</button>`).join('')}</nav><div class="sidebar-footer"><button class="btn ghost" data-view="admin">${icon('briefcase')}운영자 화면 시연${pending?`<span class="nav-badge">${pending}</span>`:''}</button><button class="btn ghost" data-view="settings">${icon('settings')}시제품 설정</button><p>처음엔 물어보는 후배로,<br>언젠가는 답해주는 선배로.<br><br>후배가 선배가 되는 날까지.</p></div></aside><div class="app-main"><header class="topbar">${brand()}<div class="topbar-left">사수에게 묻기 어려운 것도, 여기서는 편하게.</div><div class="topbar-right"><span class="demo-pill">시제품 · 예시 답변</span><button class="icon-btn" data-view="notifications" aria-label="알림 ${unread}개">${icon('bell')}${unread?`<span class="count">${unread}</span>`:''}</button><button class="icon-btn" data-view="settings" aria-label="설정">${icon('settings')}</button></div></header><main id="main" tabindex="-1" class="content ${chat?'chat-content':''}">${chat?'':`<div class="demo-note">${icon('info')}AI는 예시 답변 · 상담과 알림은 이 브라우저 안에서만 시연됩니다.</div>`}${!storageAvailable?`<div class="notice error">브라우저 저장을 사용할 수 없습니다. 새로고침하면 기록이 사라질 수 있어요.</div>`:''}<div class="${chat?'hidden':'screen'}"></div>${body}</main></div><nav class="mobile-nav" aria-label="모바일 주요 메뉴">${routes.map(([r,i,t])=>`<button class="${navActive(r)?'active':''}" data-view="${r}" ${navActive(r)?'aria-current="page"':''}>${icon(i)}<span>${t}</span></button>`).join('')}</nav>`}
function sampleStrip(){return state.conversations.some(c=>c.isSample)?`<div class="sample-strip"><span class="badge sample">예시 데이터 포함</span>직접 남긴 기록과 구분해서 보여줘.<button class="text-link" data-action="remove-samples">예시 지우기</button></div>`:''}
function render(){document.title=`선물 · ${{home:'선배에게 물어봐',chat:'이야기하는 중',history:'내 대화',consultations:'선배 상담','consult-detail':'상담 내용',growth:'성장기록',admin:'운영자 화면 시연',settings:'시제품 설정',notifications:'알림',onboarding:'처음 만나는 선배'}[view]||'선배에게 물어봐'}`;let html='';switch(view){case'onboarding':html=onboardingView();break;case'home':html=shell(homeView());break;case'chat':html=shell(chatView(),true);break;case'history':html=shell(historyView());break;case'consultations':html=shell(consultationsView());break;case'consult-detail':html=shell(consultDetailView());break;case'growth':html=shell(growthView());break;case'admin':html=shell(adminView());break;case'notifications':html=shell(notificationsView());break;case'settings':html=shell(settingsView());break;default:view='home';html=shell(homeView())}$('#app').innerHTML=html;restoreInputs();if(view==='chat')requestAnimationFrame(()=>{const box=$('#chat-scroll');if(!box)return;if(nextChatScroll==='reply'){const last=$$('.message.assistant').at(-1);if(last)box.scrollTop+=last.getBoundingClientRect().top-box.getBoundingClientRect().top-12}else box.scrollTop=box.scrollHeight;nextChatScroll='end'});}
function onboardingView(){return `<main id="main" tabindex="-1" class="welcome-wrap"><header class="welcome-head">${brand()}<span class="demo-pill">화면 시제품 v0.2.1</span></header><div class="welcome-grid"><section class="welcome-copy"><span class="label">후배가 선배가 되는 날까지.</span><h1>그 질문,<br>여기서는 편하게.</h1><p>다시 물어보기 망설여졌던 업무도,<br>누구한테 꺼내야 할지 몰랐던 고민도.<br>선물에서 하나씩 이야기해봐.</p><div class="quote">“저… 하나만 물어봐도 돼요?”<br>“그럼. 어떤 게 어려워?”<small>선배 자리로 슬쩍 찾아온 것처럼.</small></div></section><section class="welcome-card"><h2>선배가 뭐라고<br>불러주면 좋을까?</h2><p>실명 말고, 편하게 불리고 싶은 닉네임을 알려줘.</p><form id="onboarding-form" novalidate><label class="field-label" for="nickname">닉네임</label><input id="nickname" class="field" name="nickname" placeholder="예: 엠버" autocomplete="off" maxlength="16" required aria-describedby="nickname-error"><div id="nickname-error" class="form-error" role="alert"></div><label class="field-label" style="margin-top:12px">지금은 어느 정도 경력이 있어?</label><div class="career-options" role="group" aria-label="경력 선택">${CAREERS.map(c=>`<button type="button" class="career-chip ${c===chosenCareer?'selected':''}" data-career="${c}" aria-pressed="${c===chosenCareer}">${c}</button>`).join('')}</div><div class="notice" style="margin:23px 0 20px">${icon('lock')}이 시제품의 프로필과 대화는 이 브라우저에만 저장돼. 실제 업무자료나 개인정보는 입력하지 말아줘.</div><button class="btn" type="submit" style="width:100%">선배 만나러 가기 ${icon('arrow')}</button><button class="btn ghost" type="button" data-action="demo-start" style="width:100%;margin-top:10px">엠버로 먼저 둘러보기</button></form></section></div><footer class="welcome-foot">AI 예시 응답 · 실제 선배 전송 및 외부 알림 미연결 · 사용량 제한과 결제 없음</footer></main>`}
function homeView(){if(greetingIndex<0)chooseGreeting();const g=GREETINGS[greetingIndex];return `<section class="screen"><div class="row spread">${nicknameCard()}<span class="label home-side-label">내 편한 선배, 선물</span></div><div class="greeting"><div class="eyebrow">잠깐, 이야기 나눌까?</div><h1>${esc(g.main(nickname()))}</h1><p>${esc(g.sub)}</p></div><form id="home-form" class="home-composer"><label for="home-question" class="sr-only">선배에게 할 질문</label><textarea id="home-question" maxlength="2000" placeholder="선배한테 편하게 얘기해봐" rows="1"></textarea><button class="btn" type="submit" aria-label="말 걸기"><span class="send-label">말 걸기</span>${icon('send')}</button></form><div class="input-note">실명·거래처명·주민등록번호 없이, 상황만 이야기해줘.</div><div class="category-grid">${Object.entries(CATS).map(([k,c])=>`<button class="category-card" data-category="${k}"><div class="category-icon ${k}">${icon(c.icon)}</div><div><h3>${c.name}</h3><p>${c.desc}</p></div>${icon('arrow')}</button>`).join('')}</div><section><div class="section-heading"><h2>이어서 나눌 이야기</h2><button class="text-link" data-view="history">내 대화 모두 보기</button></div>${state.conversations.length?`<div class="recent-list">${[...state.conversations].sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).slice(0,3).map(c=>`<button class="recent-item" data-conversation="${c.id}">${icon(CATS[c.category]?.icon||'chat')}<div><span class="title">${esc(c.title)}</span><div class="meta">${CATS[c.category]?.name||'자유로운 이야기'} · ${fmt(c.updatedAt)} ${c.isSample?'· 예시':''}</div></div>${icon('arrow','arrow')}</button>`).join('')}</div>`:`<div class="recent-list"><p class="muted" style="padding:22px 3px;font-size:12px">첫 이야기를 나누면 여기에 이어서 볼 수 있어.</p></div>`}</section><div class="footer-line">정답을 재촉하지 않고, 다음 한 걸음을 같이 생각해볼게.</div></section>`}
function greetingFor(cat){const n=nickname();return {practice:`${n}, 어떤 업무가 헷갈렸어?\n어디까지 확인했는지 함께 얘기해주면, 다음 순서를 같이 정리해볼게.`,client:`${n}, 거래처랑 어떤 일이 있었어?\n상대가 뭐라고 했는지, 네가 어디까지 답했는지부터 들어볼게.`,senior:`${n}, 물어보려다 망설여졌구나.\n무엇이 헷갈렸는지 알려줘. 사수에게 건넬 말도 같이 정리해보자.`,worry:`${n}, 무슨 일이 있었어?\n오늘은 해결 방법을 같이 찾을까, 아니면 먼저 얘기를 들어줄까?`}[cat]}
function createConversation(cat='practice',first=''){const c={id:uid(),category:CATS[cat]?cat:'practice',title:'새로운 이야기',createdAt:now(),updatedAt:now(),isSample:false,messages:[{id:uid(),role:'assistant',content:greetingFor(cat)||greetingFor('practice'),createdAt:now(),kind:'greeting',suggestions:STARTERS[cat]||STARTERS.practice}]};state.conversations.push(c);save();go('chat',c.id);if(first)sendMessage(first);}
function getConv(){return state.conversations.find(c=>c.id===activeConversation)}
function chatView(){const c=getConv();if(!c)return emptyCard('다시 열 대화를 찾지 못했어.','내 대화에서 다른 이야기를 선택해줘.','history','내 대화 보기');const mentorCount=state.consultations.filter(x=>x.conversationId===c.id&&x.status==='requested').length;return `<div class="chat-header"><button class="icon-btn" data-view="home" aria-label="홈으로">${icon('left')}</button><div class="mentor-avatar" aria-hidden="true">선</div><div class="chat-title"><h2>선물 AI 선배</h2><p>${CATS[c.category]?.name||'자유로운 이야기'} · 예시 응답</p></div><div class="spacer"></div><button class="btn secondary small consult-cta" data-action="request-consult" ${!c.messages.some(m=>m.role==='user')?'disabled':''}>${icon('people')}${mentorCount?'내 상담 확인하기':'선배에게 묻기'}</button></div><div class="chat-scroller" id="chat-scroll" role="log" aria-label="대화 내용"><div class="chat-datestamp">${fmt(c.createdAt,{year:'numeric',month:'long',day:'numeric'})}${c.isSample?' · 대화 예시':''}</div>${c.messages.map((m,i)=>messageHTML(c,m,i)).join('')}<div class="context-note">지금은 준비된 예시 답변으로 대화 흐름을 확인하는 화면이야.</div></div><div class="composer-area"><form class="home-composer" id="chat-form"><label class="sr-only" for="chat-input">메시지</label><textarea id="chat-input" rows="1" maxlength="2000" placeholder="편하게 이어서 이야기해봐"></textarea><button class="btn" type="submit" aria-label="메시지 보내기">${icon('send')}</button></form><div class="composer-footer"><span>예시 답변 · 개인정보는 빼고 이야기해줘.</span><span class="keyboard-help">Enter 전송 · Shift + Enter 줄바꿈</span></div></div>`}
function messageHTML(c,m,i){const isUser=m.role==='user';const latest=i===c.messages.length-1;return `<article class="message ${isUser?'user':'assistant'}">${isUser?'':'<div class="mentor-avatar" aria-hidden="true">선</div>'}<div class="message-main"><div class="message-name"><strong>${isUser?esc(nickname()):'선물 AI 선배'}</strong>${isUser?'':'예시 응답'}</div><div class="bubble">${plain(m.content)}</div>${!isUser&&m.kind!=='greeting'?`<div class="message-actions"><button class="btn ghost small" data-feedback="${m.id}" ${m.helpful?'disabled':''}>${icon('check')}${m.helpful?'도움이 됐어':'도움이 됐어'}</button><button class="btn ghost small" data-reflect="${c.id}">${icon('note')}배운 점 남기기</button>${m.escalate?`<button class="btn soft small" data-action="request-consult">${icon('people')}선배 상담 준비하기</button>`:''}</div>`:''}${!isUser&&latest&&m.suggestions?.length?`<div class="suggestions">${m.suggestions.map(s=>`<button class="suggestion" data-suggest="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:''}</div></article>`}
function detectCategory(text){if(/이직|퇴사|힘들|지쳤|고민|못하는|버티|회사생활/.test(text))return'worry';if(/사수|다시 물|또 물|설명해줬|눈치/.test(text))return'senior';if(/거래처|자료.*(안|없)|연락|고객/.test(text))return'client';return'practice'}
function demoReply(c,text){const n=nickname();const userMessages=c.messages.filter(m=>m.role==='user');const previous=userMessages.slice(0,-1).map(m=>m.content).join(' ');
if(/^(고마워|감사해|고맙|감사합니다)/.test(text))return {content:`${n}, 도움이 됐다니 다행이야. 기억해두고 싶은 부분이 있다면 ‘배운 점 남기기’에 네 말로 한 줄 적어둬도 좋아.\n다시 궁금해져도 편하게 물어봐.`,kind:'support'};
if(/죽고\s*싶|자살|자해|스스로.*해치/.test(text))return {content:`${n}, 지금은 혼자 견디지 않아도 돼. 이 시연 채팅은 긴급한 도움을 연결해주지는 못해.\n\n지금 자신을 해칠 위험이 있다면 현지 응급서비스에 바로 연락하거나 가까운 사람에게 곁에 있어 달라고 부탁해줘. 해칠 수 있는 물건과는 거리를 두고, 사람이 있는 안전한 곳으로 이동해줘.`,kind:'support',escalate:false};
if(/원천세|급여.*(오류|잘못)|신고.*잘못/.test(text)&&!(/세액|급여액/.test(text)))return {content:`${n}, 놀랐겠다. 아직은 어떤 오류인지부터 구분해보자.\n\n**급여액을 잘못 적은 거야, 아니면 세액이 달라진 거야?**\n신고서에 적힌 숫자와 실제 납부한 금액이 같은지도 같이 확인해줘. 지금은 처리 방법부터 단정하지 않을게.`,kind:'clarify',suggestions:['급여액이 잘못된 것 같아요.','세액이 적게 반영됐어요.']};
if(/원천세|급여액|세액|수정신고/.test(text+' '+previous))return {content:`${n}, 먼저 **틀린 항목과 금액, 신고한 기간, 실제 납부내역**을 한 줄씩 정리해보자. 원자료와 신고서에서 어디가 다른지도 표시해두고.\n\n수정 방법이나 가산세 여부는 이 예시 답변에서 판단하지 않을게. 다른 달 금액에 임의로 섞어 반영하기보다는, 확인한 사실을 가지고 담당 사수에게 처리 방향을 확인하자.\n\n사수에게는 이렇게 말할 수 있어.\n“해당 건을 확인하다가 차이를 발견했습니다. 원자료는 ○○이고 신고서에는 ○○로 반영됐습니다. 납부내역은 여기까지 확인했는데, 정정 절차를 함께 확인해주실 수 있을까요?”\n\n이상한 부분을 그냥 넘기지 않고 확인하려는 건 잘한 행동이야.`,kind:'workflow',escalate:true};
if(/들어.*(줘|주)|해결.*말고|그냥.*들/.test(text)&&c.category==='worry')return {content:`${n}, 그럼 지금은 해결책부터 꺼내지 않을게.\n오늘 마음에 가장 남았던 순간이 언제였어? 말하기 편한 만큼만 들려줘.`,kind:'support',suggestions:['계속 눈치를 보느라 힘들었어요.','실수할까 봐 하루 종일 긴장했어요.']};
if(c.category==='worry'||/지쳤|힘들|못하는|이직|퇴사/.test(text))return {content:`${n}, 오늘 마음이 많이 무거웠겠다. 지금 바로 잘하고 있는지, 그만둬야 하는지 결론을 내릴 필요는 없어.\n\n**특히 힘들었던 장면 하나만 이야기해줄래?**\n업무 자체가 낯설었던 건지, 누군가의 말이나 반응 때문에 힘들었던 건지 같이 나눠보자. 오늘은 그냥 들어주기만 해도 괜찮아.`,kind:'support',suggestions:['일보다 사수의 반응이 무서워요.','해결책 말고 그냥 들어줘요.']};
if(/자료|연락.*없|답.*없/.test(text)&&c.category==='client')return {content:`${n}, 다시 요청해야 하는데 재촉하는 것처럼 느껴질까 신경 쓰였겠네.\n\n나라면 **필요한 자료와 필요한 날짜를 짧게 묶어서** 다시 안내할 것 같아. 이미 받은 자료를 또 요청하는 건 아닌지도 먼저 확인하고.\n\n“안녕하세요. 앞서 요청드린 자료 중 ○○가 아직 확인되지 않아 연락드립니다. 다음 작업을 진행하려면 ○월 ○일까지 필요합니다. 전달이 어려우시면 가능한 일정을 알려주실 수 있을까요?”\n\n요청한 날짜와 답변도 메모해둬. 정해진 일정에 영향이 있다면 혼자 계속 기다리지 말고 사수에게 현재 상황을 공유하는 게 좋아.`,kind:'workflow',suggestions:['그런데 계속 답이 없으면요?','사수에게는 어떻게 보고할까요?']};
if(c.category==='senior'||/사수|다시 물|또 물/.test(text))return {content:`${n}, 이미 설명을 들었는데 다시 물으려니 망설여졌구나.\n\n질문하기 전에 전부 해결하려고 할 필요는 없어. **이해한 부분과 아직 헷갈리는 부분을 한 가지씩 나눠서** 말해보자.\n\n“아까 알려주신 내용 중 A까지는 이해했습니다. 그런데 B 상황에서도 같은 방식인지 헷갈려서요. 제가 C로 이해한 게 맞을까요?”\n\n바쁜 중이라면 “짧게 확인받고 싶은 게 있는데 언제 여쭤보면 괜찮을까요?”라고 먼저 물어도 돼. 확인하고 넘어가려는 태도를 숨길 필요는 없어.`,kind:'workflow',suggestions:['제가 이해한 내용을 정리해볼게요.','사수가 너무 바쁠 때는요?']};
if(c.category==='client')return {content:`${n}, 바로 설명하려고 하면 말이 더 꼬일 수 있겠네. 우선 **확인된 사실과 아직 확인하지 못한 부분**을 나눠보자.\n\n거래처가 어떤 말을 했고, 너는 어디까지 안내했어? 그 내용을 바탕으로 전달할 문장을 함께 정리해볼게. 실제 상황에 대한 판단이 필요하면 선배 상담으로 넘길 내용도 준비할 수 있어.`,kind:'clarify',escalate:true};
if(/처음|어디부터|확인할/.test(text))return {content:`${n}, 처음 맡으면 어디부터 봐야 할지 막막할 수 있어. 나라면 먼저 **이번 업무의 결과물, 마감일, 필요한 자료**부터 확인할 것 같아.\n\n지난번 처리 자료가 있다면 그대로 따라 하기보다 이번과 달라진 점을 표시해봐. 그다음 막힌 부분만 좁혀서 사수에게 물으면 질문하기도 편해져.\n\n지금 맡은 업무가 무엇인지, 받은 자료는 어떤 것인지부터 알려줄래?`,kind:'workflow',escalate:true};
if(/고마|감사/.test(text))return {content:`${n}, 도움이 됐다니 다행이야. 기억해두고 싶은 부분이 있다면 ‘배운 점 남기기’에 네 말로 한 줄 적어둬도 좋아.\n다시 궁금해져도 편하게 물어봐.`,kind:'support'};
return {content:`${n}, 이 질문에 맞춰 확인된 답을 줄 만큼의 노하우가 이 시제품에는 아직 연결돼 있지 않아. 그럴듯한 답을 만들어내지는 않을게.\n\n지금까지 확인한 내용과 가장 궁금한 점을 정리해서 **실제 선배에게 보낼 상담 요청**을 준비해볼까?\n\n선배 상담은 바로 답이 오는 방식이 아니야. 오늘 처리해야 하는 업무라면 사무실의 담당자에게 먼저 확인해줘.`,kind:'handoff',escalate:true};}
function sendMessage(raw){const text=raw.trim();if(!text)return;const c=getConv();if(!c)return;if([...text].length>2000){toast('한 번에 2,000자 이내로 이야기해줘.');return;}c.messages.push({id:uid(),role:'user',content:text,createdAt:now()});if(c.title==='새로운 이야기')c.title=[...text].slice(0,42).join('');const result=demoReply(c,text);c.messages.push({id:uid(),role:'assistant',content:result.content,kind:result.kind||'demo',suggestions:result.suggestions||[],escalate:!!result.escalate,createdAt:now()});c.updatedAt=now();inputDrafts.chat[c.id]='';nextChatScroll='reply';save();render();$('#live-status').textContent='선물의 예시 답변이 추가되었습니다.';$('#chat-input')?.focus({preventScroll:true});}
function emptyCard(title,desc,route,label){return `<div class="empty"><div class="empty-icon">${icon('chat')}</div><h3>${esc(title)}</h3><p>${esc(desc)}</p>${route?`<button class="btn secondary small" data-view="${route}">${label}</button>`:''}</div>`}
function historyView(){return `<section class="screen"><div class="page-heading row spread"><div><h1>내 대화</h1><p>같은 질문이어도 괜찮아. 필요할 때 다시 꺼내보자.</p></div><button class="btn secondary small" data-view="home">${icon('plus')}새 이야기</button></div>${sampleStrip()}<div class="searchbar">${icon('search')}<label class="sr-only" for="history-search">질문과 답변 검색</label><input id="history-search" placeholder="질문이나 답변에서 찾아보기" value="${esc(historySearch)}"></div><div class="history-tools"><button class="btn secondary small favorite-filter ${historyFavoritesOnly?'active':''}" data-action="filter-favorites" aria-pressed="${historyFavoritesOnly}">${icon('star')}즐겨찾기만 보기</button></div><div class="tabs" aria-label="대화 분류"><button class="tab ${historyFilter==='all'?'active':''}" data-history-filter="all">전체</button>${Object.entries(CATS).map(([k,c])=>`<button class="tab ${historyFilter===k?'active':''}" data-history-filter="${k}">${c.name}</button>`).join('')}</div><div id="history-results">${historyItems()}</div></section>`}

function historyItems(){
  const list=state.conversations.filter(c=>(!historyFavoritesOnly||c.isFavorite)&&(historyFilter==='all'||historyFilter===c.category)&&(!historySearch||c.title.includes(historySearch)||c.messages.some(m=>m.content.includes(historySearch)))).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));
  if(!list.length&&historyFavoritesOnly)return `<div class="empty"><div class="empty-icon">${icon('star')}</div><h3>${historySearch||historyFilter!=='all'?'조건에 맞는 즐겨찾기가 없어.':'아직 즐겨찾기한 대화가 없어.'}</h3><p>${historySearch||historyFilter!=='all'?'검색어나 분류를 바꾸거나 전체 대화를 확인해봐.':'다시 보고 싶은 대화 오른쪽의 별을 눌러두면 여기서 모아볼 수 있어.'}</p><button class="btn secondary small" data-action="clear-history-filters">전체 대화 보기</button></div>`;
  return list.length?list.map(c=>`<article class="history-entry"><button class="history-card" data-conversation="${c.id}"><div class="history-meta"><span class="badge">${CATS[c.category]?.name||'자유로운 이야기'}</span>${c.isSample?'<span class="badge sample">대화 예시</span>':''}<span class="spacer"></span>${fmt(c.updatedAt)}</div><h3>${esc(c.title)}</h3><p>${esc(c.messages.filter(m=>m.role==='assistant').at(-1)?.content.replace(/\*\*/g,'')||'')}</p></button><button class="icon-btn favorite-toggle ${c.isFavorite?'active':''}" data-favorite="${c.id}" aria-pressed="${!!c.isFavorite}" aria-label="${esc(c.title)} ${c.isFavorite?'즐겨찾기 해제':'즐겨찾기에 추가'}" title="${c.isFavorite?'즐겨찾기 해제':'즐겨찾기에 추가'}">${icon('star')}</button></article>`).join(''):emptyCard('아직 해당하는 이야기가 없어.','새로 질문하거나 다른 검색어로 찾아봐.','home','선배에게 말 걸기');
}
function toggleFavorite(id){
  const c=state.conversations.find(x=>x.id===id);if(!c)return;
  const before=c.isFavorite;c.isFavorite=!before;
  if(!save()){c.isFavorite=before;return}
  const results=$('#history-results');if(results)results.innerHTML=historyItems();
  ($$('[data-favorite]').find(b=>b.dataset.favorite===id)||$('[data-action="filter-favorites"]'))?.focus({preventScroll:true});
  toast(c.isFavorite?'다시 보고 싶은 대화를 즐겨찾기에 넣었어.':'즐겨찾기를 해제했어. 대화는 그대로 남아 있어.');
}

function consultationsView(){const items=state.consultations.filter(c=>consultationFilter==='all'||(consultationFilter==='waiting'?c.status==='requested':c.status==='answered')).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return `<section class="screen"><div class="page-heading"><h1>선배 상담</h1><p>혼자 판단하기 어려운 질문은, 실제 선배의 경험을 빌려보자.</p></div><div class="consult-banner">${icon('clock')}<div><h3>실제 선배 상담은 아직 연결 준비 중이야.</h3><p>공유할 내용을 확인하는 과정부터 미리 살펴볼 수 있어.<br>급한 업무는 사무실 담당자에게 먼저 확인해줘.</p></div></div><div class="tabs"><button class="tab ${consultationFilter==='all'?'active':''}" data-consult-filter="all">전체</button><button class="tab ${consultationFilter==='waiting'?'active':''}" data-consult-filter="waiting">답변 대기</button><button class="tab ${consultationFilter==='answered'?'active':''}" data-consult-filter="answered">답변 도착</button></div>${items.length?items.map(c=>`<button class="history-card" data-consult="${c.id}"><div class="history-meta"><span class="badge ${c.status==='answered'?'green':'amber'}">${c.status==='answered'?'답변 도착':'답변 대기'} · 시연</span><span class="spacer"></span>${fmt(c.createdAt)}</div><h3>${esc(c.question)}</h3><p>${c.answer?esc(c.answer):'선배에게 공유할 내용을 이 브라우저에 저장했어.'}</p></button>`).join(''):emptyCard('아직 선배에게 부탁한 상담이 없어.','대화 중 ‘선배에게 묻기’를 누르면, 공유할 내용을 확인할 수 있어.','home','이야기 시작하기')}</section>`}
function consultDetailView(){const c=state.consultations.find(c=>c.id===activeConsultation);if(!c)return emptyCard('상담을 찾지 못했어.','상담 목록을 다시 확인해줘.','consultations','상담 목록');return `<section class="screen"><button class="btn ghost small" data-view="consultations">${icon('left')}상담 목록</button><div class="detail-head"><span class="badge ${c.status==='answered'?'green':'amber'}">${c.status==='answered'?'답변 도착':'답변 대기'} · 시연</span><h1 style="margin-top:13px">${esc(c.question)}</h1><div class="detail-meta">${esc(c.nickname)} · ${esc(c.career)}<span>·</span>${fmt(c.createdAt)}</div></div><div class="notice warm">${icon('info')}이 상담은 브라우저 안에서만 시연 중이야. 실제 선배에게 전달되거나 외부 알림이 발송되지는 않았어.</div><div class="consult-status"><span class="active">시연 내용 저장</span><span class="line"></span><span class="active">${c.status==='answered'?'답변 작성 완료':'답변 대기'}</span><span class="line"></span><span class="${c.status==='answered'?'active':''}">답변 도착</span></div><div class="row wrap flow-actions">${c.conversationId?`<button class="btn secondary small" data-conversation="${c.conversationId}">${icon('chat')}이어서 대화하기</button>`:''}<button class="btn soft small" data-view="growth">${icon('book')}성장기록 보기</button></div><div class="card"><div class="section-heading"><h2>공유하기로 확인한 내용</h2><span class="badge">선택한 대화 ${c.sharedMessages.length}개</span></div><p class="detail-text">${esc(c.summary)}</p><details class="disclosure" style="margin-top:17px"><summary>공유하기로 선택한 대화 보기</summary>${c.sharedMessages.map(m=>`<div class="shared-message"><strong>${m.role==='user'?esc(c.nickname):'선물 AI 선배 · 예시'}</strong>${esc(m.content)}</div>`).join('')}</details></div>${c.answer?`<div class="card" style="margin-top:17px"><div class="row" style="margin-bottom:18px"><div class="mentor-avatar" aria-hidden="true">선</div><div><h3>선배 답변 <span class="badge sample">운영자 입력 · 시연</span></h3><p class="tiny muted">${fmt(c.answeredAt,{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}</p></div></div><div class="detail-text">${esc(c.answer)}</div>${c.feedback?`<div class="quote-note"><span class="label">선배가 짚어준 점</span><p style="margin-top:7px">${esc(c.feedback)}</p></div>`:''}<button class="btn soft small" style="margin-top:20px" data-reflect="${c.conversationId}">${icon('note')}배운 점 남기기</button></div>`:`<div class="card" style="margin-top:17px"><h3>답변이 여기에 이어질 거야.</h3><p class="muted" style="font-size:12px;margin-top:8px">시연에서는 운영자 화면에 직접 답변을 입력해 흐름을 확인할 수 있어.</p><button class="btn secondary small" style="margin-top:18px" data-admin-consult="${c.id}">${icon('briefcase')}운영자 답변 화면 체험</button></div>`}</section>`}
function growthView(){
  const months=[...new Set([...state.conversations.flatMap(c=>c.messages.map(m=>monthKey(m.createdAt))),...state.reflections.map(r=>monthKey(r.createdAt)),...state.consultations.filter(c=>c.feedback&&c.answeredAt).map(c=>monthKey(c.answeredAt))])].sort().reverse();
  const inMonth=d=>growthMonth==='all'||monthKey(d)===growthMonth;
  const convs=state.conversations.filter(c=>c.messages.some(m=>m.role==='user'&&inMonth(m.createdAt)));
  const questions=convs.flatMap(c=>c.messages.filter(m=>m.role==='user'&&inMonth(m.createdAt)).map(m=>({...m,conversationId:c.id,category:c.category,isSample:c.isSample}))).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const refs=state.reflections.filter(r=>inMonth(r.createdAt)).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const feedback=state.consultations.filter(c=>c.feedback&&inMonth(c.answeredAt)).sort((a,b)=>b.answeredAt.localeCompare(a.answeredAt));
  const topics=Object.entries(CATS).map(([k,c])=>({name:c.topic,count:questions.filter(q=>q.category===k).length})).filter(t=>t.count);
  return `<section class="screen growth-screen">
    <div class="page-heading"><div class="row spread wrap"><div><h1>나의 성장기록</h1><p>궁금했던 것과 배운 점을 다시 꺼내보자.</p></div><label class="sr-only" for="growth-month">기록 기간</label><select class="month-filter" id="growth-month"><option value="all">전체 기록</option>${months.map(m=>`<option value="${m}" ${growthMonth===m?'selected':''}>${m.replace('-','년 ')}월</option>`).join('')}</select></div></div>
    ${sampleStrip()}
    <div class="growth-layout">
      <section class="card reflection-card"><div class="section-heading"><h2>내 말로 남긴 배운 점</h2><button class="btn soft small" data-action="new-reflection">${icon('plus')}기록하기</button></div>
      ${refs.length?refs.map(r=>`<article class="reflection"><div class="timeline-date">${fmt(r.createdAt)} ${r.isSample?'<span class="badge sample">기록 예시</span>':''}${r.updatedAt?' · 수정됨':''}</div><p>${esc(r.text)}</p>${r.tried?'<span class="badge green">직접 해봤어요 · 자기기록</span>':''}<div class="reflection-links">${r.conversationId?`<button class="text-link" data-conversation="${r.conversationId}">그때 나눈 이야기</button>`:''}<span class="spacer"></span><button class="text-link" data-edit-reflection="${r.id}" aria-label="${esc(r.text.slice(0,18))} 기록 수정">수정</button><button class="text-link muted" data-delete-reflection="${r.id}" aria-label="${esc(r.text.slice(0,18))} 기록 삭제">삭제</button></div></article>`).join(''):emptyCard('오늘 배운 걸 한 줄 남겨볼까?','잘 정리된 문장이 아니어도 괜찮아. 네 말로 적어봐.','','')}
      </section>
      <section class="card"><h2>선배가 짚어준 점</h2><p class="field-hint">상담에 직접 입력된 피드백만 모았어.</p>
      ${feedback.length?feedback.map(c=>`<div class="quote-note"><span class="badge sample">선배 피드백 · 시연</span><p>${esc(c.feedback)}</p><div class="timeline-date">${fmt(c.answeredAt)}</div><button class="text-link" data-consult="${c.id}">상담에서 다시 보기</button></div>`).join(''):'<div class="record-empty">아직 남겨진 피드백이 없어.<br>상담에 피드백이 등록되면 여기서 볼 수 있어.</div>'}
      </section>
    </div>
    <section class="card question-records"><div class="section-heading"><h2>다시 보고 싶은 질문</h2><button class="text-link" data-view="history">내 대화 모두 보기</button></div>
    ${questions.length?`<div class="recent-list">${questions.slice(0,5).map(q=>`<button class="recent-item" data-conversation="${q.conversationId}">${icon('chat')}<div><span class="title">${esc(q.content.slice(0,100))}</span><div class="meta">${CATS[q.category]?.name||'이야기'} · ${fmt(q.createdAt)}${q.isSample?' · 예시':''}</div></div>${icon('arrow','arrow')}</button>`).join('')}</div>`:'<p class="record-empty">이야기를 나누면 질문을 여기서 다시 볼 수 있어.</p>'}
    <details class="record-summary"><summary>질문·분야별 기록 수 보기</summary><div class="usage-summary"><span>질문 <strong>${questions.length}개</strong></span><span>분야 <strong>${topics.length}개</strong></span><span>배운 점 <strong>${refs.length}개</strong></span></div>${topics.map(t=>`<div class="topic-row"><span>${t.name}</span><span>${t.count}개 질문</span></div>`).join('')}</details>
    <p class="growth-caption">횟수는 사용 기록이야. 질문이 많거나 같은 걸 다시 물었다고 업무 능력을 평가하지 않아.</p></section>
  </section>`;
}

function adminView(){const waiting=state.consultations.filter(c=>c.status==='requested');const answered=state.consultations.filter(c=>c.status==='answered');if(!state.consultations.some(c=>c.id===activeAdmin))activeAdmin=waiting[0]?.id||state.consultations[0]?.id||null;const selected=state.consultations.find(c=>c.id===activeAdmin);return `<section class="screen"><div class="page-heading"><h1>선배 상담 데스크 · 시연</h1><p>후배가 공유하기로 선택한 내용부터 확인해주세요.</p></div><div class="notice warm">${icon('lock')}운영자 화면 시연입니다. 보안 로그인은 연결되지 않았습니다. 실제 사용자의 상담을 받는 용도로 사용하지 마세요.</div><div class="stat-grid admin-count-grid"><div class="stat"><span class="stat-label">답변 대기</span><strong>${waiting.length}<small>건</small></strong></div><div class="stat"><span class="stat-label">답변 완료</span><strong>${answered.length}<small>건</small></strong></div><div class="stat"><span class="stat-label">노하우 초안</span><strong>${state.drafts.length}<small>건</small></strong></div></div><div class="tabs"><button class="tab ${adminTab==='requests'?'active':''}" data-admin-tab="requests">상담 관리</button><button class="tab ${adminTab==='knowledge'?'active':''}" data-admin-tab="knowledge">노하우 초안</button></div>${adminTab==='knowledge'?knowledgeView():!state.consultations.length?emptyCard('아직 접수된 상담이 없습니다.','대화 화면에서 상담을 요청하면 이곳에 표시됩니다.','home','사용자 화면으로'):`<div class="admin-grid"><div class="admin-list">${[...state.consultations].sort((a,b)=>a.status.localeCompare(b.status)||b.createdAt.localeCompare(a.createdAt)).map(c=>`<button class="${c.id===activeAdmin?'selected':''}" data-admin-select="${c.id}"><div class="row spread"><strong>${esc(c.nickname)}</strong><span class="badge ${c.status==='answered'?'green':'amber'}">${c.status==='answered'?'답변 완료':'대기'}</span></div><p>${esc(c.question)}</p><small>${esc(c.career)} · ${fmt(c.createdAt)}</small></button>`).join('')}</div><div class="card admin-detail">${selected?adminDetail(selected):''}</div></div>`}</section>`}
function adminDetail(c){return `<div class="row spread"><div><h2>${esc(c.nickname)} <span class="muted" style="font-size:13px;font-weight:400">${esc(c.career)}</span></h2><p class="tiny muted">${fmt(c.createdAt)} · 상담 시연</p></div><span class="badge">선택한 대화만 공유</span></div><div class="divider"></div><label class="field-label">후배가 정리한 질문</label><p class="detail-text">${esc(c.summary)}</p><details class="disclosure" style="margin:18px 0"><summary>공유에 동의한 대화 ${c.sharedMessages.length}개 확인</summary>${c.sharedMessages.map(m=>`<div class="shared-message"><strong>${m.role==='user'?esc(c.nickname):'AI 예시 답변'}</strong>${esc(m.content)}</div>`).join('')}</details><p class="tiny muted" style="margin-bottom:20px">다른 상담·고민·전체 질문 이력은 공유되지 않습니다.</p>${c.answer?`<div class="notice">${icon('check')}이 브라우저의 사용자 알림함에 답변 알림이 추가됐습니다.</div><label class="field-label" style="margin-top:19px">작성한 답변</label><div class="detail-text">${esc(c.answer)}</div>${c.feedback?`<div class="quote-note">${esc(c.feedback)}</div>`:''}<div class="row wrap" style="margin-top:22px"><button class="btn secondary small" data-draft="${c.id}">${icon('note')}노하우 초안 만들기</button><button class="btn soft small" data-consult="${c.id}">사용자 화면에서 보기</button></div>`:`<form id="admin-answer-form" data-consult-id="${c.id}"><label for="mentor-answer" class="field-label">선배 답변</label><textarea id="mentor-answer" class="field" maxlength="5000" rows="7" placeholder="먼저 확인할 것, 지금 할 수 있는 일, 건넬 말을 짧게 정리해주세요." required></textarea><label for="mentor-feedback" class="field-label" style="margin-top:17px">잘한 행동을 짚어주기 <span class="muted">(선택)</span></label><textarea id="mentor-feedback" class="field" maxlength="500" rows="2" style="min-height:75px" placeholder="실제 대화에서 확인한 행동만 적어주세요. 사용자 성장기록에 함께 표시됩니다."></textarea><div class="row spread wrap" style="margin-top:18px"><button type="button" class="text-link" data-action="answer-example">예시 문장 채우기</button><button type="submit" class="btn">답변 등록 시연 ${icon('send')}</button></div><p class="tiny muted" style="margin-top:12px">외부 푸시·이메일은 발송되지 않습니다.</p></form>`}`}
function knowledgeView(){return `<div class="notice" style="margin-bottom:20px">${icon('info')}상담 답변을 저장해도 AI가 자동으로 학습하지 않습니다. 이 시제품은 검토 전 초안만 보관하며, 지식 검색에 사용하지 않습니다.</div>${state.drafts.length?state.drafts.map(d=>`<article class="card draft-card"><div class="row spread"><h3>${esc(d.title)}</h3><span class="badge amber">검토 전 · AI 미사용</span></div><p>${esc(d.content)}</p><div class="tiny muted" style="margin-top:13px">${fmt(d.createdAt)} · 재사용 동의 별도 확인 필요</div></article>`).join(''):emptyCard('상담에서 쌓인 경험을 초안으로 남겨보세요.','답변을 등록한 뒤 ‘노하우 초안 만들기’를 누르면 됩니다.','','')}`}
function notificationsView(){return `<section class="screen"><div class="page-heading row spread"><div><h1>알림</h1><p>이 브라우저 안에서 답변 도착을 확인하는 시연이야.</p></div>${state.notifications.length?'<button class="text-link" data-action="read-all">모두 읽음</button>':''}</div>${state.notifications.length?[...state.notifications].reverse().map(n=>`<button class="notification ${n.read?'':'unread'}" data-notification="${n.id}"><span class="dot"></span><div><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><small>${fmt(n.createdAt)} · 로컬 알림 시연</small></div>${icon('arrow')}</button>`).join(''):emptyCard('아직 도착한 알림이 없어.','시연 상담에 답변을 등록하면 여기에 알림이 생겨.','consultations','상담 보기')}<p class="growth-caption">잠금화면·이메일·다른 기기로 알림을 보내는 기능은 아직 연결되지 않았어.</p></section>`}
function settingsView(){return `<section class="screen"><div class="page-heading"><h1>시제품 설정</h1><p>지금은 서비스 흐름과 말투를 확인하는 단계야.</p></div><section class="card"><div class="settings-row"><div><h3>${esc(nickname())}</h3><p>${esc(state.profile?.career)} · 닉네임은 언제든 바꿀 수 있어.</p></div><button class="btn secondary small" data-action="profile">수정</button></div><div class="settings-row"><div><h3>이 브라우저에만 저장</h3><p>다른 기기로 동기화되지 않아. 공유 PC에는 실제 업무 내용을 남기지 말아줘.</p></div>${icon('lock')}</div><div class="settings-row"><div><h3>사용량 제한 · 결제</h3><p>모두 꺼져 있어. 이번 시제품에서는 횟수를 정하지 않아.</p></div><span class="badge">OFF</span></div><div class="settings-row"><div><h3>닉네임 카드의 작은 그림</h3><p>선택한 경력에 따라 달라지는 장식이야. 질문 수나 배운 점으로 업무 능력을 평가하는 표시는 아니야.</p></div></div><div class="settings-row"><div><h3>화면 기록 내보내기</h3><p>현재 브라우저의 시연 데이터를 JSON 파일로 저장해.</p></div><button class="btn secondary small" data-action="export">${icon('download')}저장</button></div><div class="settings-row"><div><h3>예시 대화 지우기</h3><p>직접 만든 대화·상담·기록은 남겨둬.</p></div><button class="btn secondary small" data-action="remove-samples">지우기</button></div><div class="settings-row" style="border-bottom:0"><div><h3>이 기기의 모든 기록 삭제</h3><p>닉네임, 대화, 상담, 배운 점이 함께 삭제돼.</p></div><button class="btn danger small" data-action="reset">전체 삭제</button></div></section><section class="card" style="margin-top:18px"><div class="row spread"><div><h3>운영자 화면도 확인해볼까?</h3><p class="tiny muted" style="margin-top:5px">보안 로그인 없는 시연 전용 화면이야.</p></div><button class="btn soft small" data-view="admin">열기</button></div></section><div class="file-note" style="margin-top:18px">연결되지 않은 기능: 실제 AI / 검수된 100문100답 검색 / 계정 로그인 / 서버 저장 / 실제 선배 전송 / 외부 알림 / 결제.<br>이 시제품은 세무·노무 판단을 제공하는 실제 서비스가 아니야.</div></section>`}
function openDialog(html,wide=false){
  captureInputs();modalOpener=document.activeElement;
  $('#dialog-root').innerHTML=`<div class="dialog-backdrop"><section class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${html}</section></div>`;
  $('#app').inert=true;document.body.style.overflow='hidden';
  setTimeout(()=>$('.dialog input:not([type="checkbox"]),.dialog textarea,.dialog button')?.focus(),10);
}

function closeDialog(){
  const had=!!$('.dialog');$('#dialog-root').innerHTML='';$('#app').inert=false;
  document.body.style.overflow='';if(had&&modalOpener?.isConnected)modalOpener.focus({preventScroll:true});
}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){go(b.dataset.view);return;}if(b.dataset.career){chosenCareer=b.dataset.career;$$('.career-chip').forEach(x=>{x.classList.toggle('selected',x.dataset.career===chosenCareer);x.setAttribute('aria-pressed',String(x.dataset.career===chosenCareer))});return;}if(b.dataset.category){createConversation(b.dataset.category);return;}if(b.dataset.conversation){const id=b.dataset.conversation;if(state.conversations.some(c=>c.id===id))go('chat',id);else toast('이 대화는 삭제돼서 다시 열 수 없어.');return;}if(b.dataset.suggest){sendMessage(b.dataset.suggest);return;}if(b.dataset.editReflection){reflectionDialog(null,b.dataset.editReflection);return;}if(b.dataset.deleteReflection){deleteReflectionDialog(b.dataset.deleteReflection);return;}if(b.dataset.confirmDeleteReflection){const before=state.reflections;state.reflections=before.filter(r=>r.id!==b.dataset.confirmDeleteReflection);if(!save()){state.reflections=before;return;}closeDialog();render();toast('배운 점 기록 하나를 삭제했어.');return;}if(b.dataset.reflect!==undefined){reflectionDialog(b.dataset.reflect);return;}if(b.dataset.feedback){const c=getConv();const m=c?.messages.find(x=>x.id===b.dataset.feedback);if(m){m.helpful=true;save();b.disabled=true;toast('어떤 답이 도움이 됐는지 기록했어.')}return;}if(b.dataset.favorite){toggleFavorite(b.dataset.favorite);return;}if(b.dataset.historyFilter){historyFilter=b.dataset.historyFilter;render();return;}if(b.dataset.consultFilter){consultationFilter=b.dataset.consultFilter;render();return;}if(b.dataset.consult){go('consult-detail',b.dataset.consult);return;}if(b.dataset.adminConsult){adminTab='requests';go('admin',b.dataset.adminConsult);return;}if(b.dataset.adminSelect){activeAdmin=b.dataset.adminSelect;render();return;}if(b.dataset.adminTab){adminTab=b.dataset.adminTab;render();return;}if(b.dataset.draft){draftDialog(b.dataset.draft);return;}if(b.dataset.notification){const n=state.notifications.find(x=>x.id===b.dataset.notification);if(n){n.read=true;save();go('consult-detail',n.consultationId)}return;}switch(b.dataset.action){case'filter-favorites':historyFavoritesOnly=!historyFavoritesOnly;render();$('[data-action="filter-favorites"]')?.focus({preventScroll:true});break;case'clear-history-filters':historyFavoritesOnly=false;historyFilter='all';historySearch='';render();$('#history-search')?.focus({preventScroll:true});break;case'demo-start':startDemo();break;case'profile':profileDialog();break;case'request-consult':requestDialog();break;case'close-dialog':closeDialog();break;case'new-reflection':reflectionDialog(null);break;case'answer-example':$('#mentor-answer').value=`${state.consultations.find(c=>c.id===activeAdmin)?.nickname||nickname()}, 지금까지 확인한 내용을 정리해서 물어본 건 잘했어.\n\n먼저 확인된 사실과 아직 확인하지 못한 부분을 나눠보자. 그다음 담당 사수에게 확인받을 내용을 한 가지씩 정리해보면 좋겠어.\n\n“제가 A까지 확인했고, B 부분이 헷갈립니다. C 방향으로 생각했는데 한 번 확인해주실 수 있을까요?”라고 말해볼 수 있어.\n\n이 문장은 화면 흐름을 확인하기 위한 예시야. 실제 업무에 대한 판단은 포함하지 않았어.`;$('#mentor-feedback').value='확인한 사실과 궁금한 점을 구분해서 질문한 행동이 좋았어.';break;case'export':exportData();break;case'remove-samples':removeSamples();break;case'read-all':state.notifications.forEach(n=>n.read=true);save();render();break;case'reset':resetDialog();break;case'confirm-reset':try{localStorage.removeItem(STORAGE_KEY)}catch{}state=emptyState();historyFavoritesOnly=false;historyFilter='all';historySearch='';inputDrafts.home='';inputDrafts.chat={};inputDrafts.consult={};closeDialog();view='onboarding';activeConversation=null;activeConsultation=null;activeAdmin=null;render();toast('이 기기의 모든 기록을 삭제했어.');break;}});

.id];closeDialog();go('consult-detail',cons.id);toast('상담 시연 내용을 저장했어. 실제 전송은 되지 않았어.');break;}case'admin-answer-form':{const c=state.consultations.find(x=>x.id===form.dataset.consultId);const text=$('#mentor-answer').value.trim();if(!c||!text){$('#mentor-answer')?.focus();return;}if(c.status==='answered'){toast('이미 답변이 등록된 상담이야.');return;}const beforeAnswer={...c};c.answer=text;c.feedback=$('#mentor-feedback').value.trim()||null;c.answeredAt=now();c.status='answered';state.notifications.push({id:uid(),consultationId:c.id,createdAt:now(),read:false,title:`${c.nickname}, 시연 답변이 등록됐어.`,body:'네가 남긴 상담에 답변이 등록됐어. 내용은 상담 화면에서 확인해줘.'});if(!save()){Object.assign(c,beforeAnswer);state.notifications.pop();return;}render();toast('시연 답변을 저장했어. 이 브라우저의 알림함에서 확인할 수 있어.');break;}case'reflection-form':{const text=$('#reflection-text').value.trim();if(!text)return;const id=form.dataset.reflectionId;const before=state.reflections;const r=before.find(x=>x.id===id);state.reflections=r?before.map(x=>x.id===id?{...x,text,tried:$('#reflection-tried').checked,updatedAt:now(),isSample:false}:x):[...before,{id:uid(),conversationId:form.dataset.conversationId||null,text,tried:$('#reflection-tried').checked,createdAt:now(),isSample:false}];if(!save()){state.reflections=before;return;}closeDialog();go('growth');toast(r?'배운 점을 수정했어.':'배운 점을 성장기록에 남겼어.');break;}case'draft-form':{if(!$('#draft-reviewed').checked)return;const title=$('#draft-title').value.trim();const content=$('#draft-content').value.trim();if(!title||!content)return;const id=form.dataset.consultId;if(state.drafts.some(d=>d.consultationId===id)){toast('이미 저장된 초안이 있어.');return;}state.drafts.push({id:uid(),consultationId:id,title,content,status:'draft',createdAt:now(),privacyReviewedByOperator:true,reuseConsent:'not-confirmed',eligibleForAI:false});save();closeDialog();adminTab='knowledge';go('admin');toast('검토 전 초안을 저장했어. AI 답변에는 아직 사용하지 않아.');break;}}});
document.addEventListener('input',e=>{if(e.target.id==='request-summary'){$('#share-consent').checked=false;updateShareReview()}if(e.target.id==='home-question')inputDrafts.home=e.target.value;if(e.target.id==='chat-input'&&activeConversation)inputDrafts.chat[activeConversation]=e.target.value;if(e.target.id==='history-search'){historySearch=e.target.value;$('#history-results').innerHTML=historyItems()}if(['home-question','chat-input'].includes(e.target.id)){const el=e.target;el.style.height='49px';el.style.height=Math.min(el.scrollHeight,130)+'px'}});
document.addEventListener('change',e=>{if(e.target.name==='shared'){$('#share-consent').checked=false;updateShareReview()}if(e.target.id==='share-consent')updateShareReview();if(e.target.id==='growth-month'){growthMonth=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('.dialog')){e.preventDefault();closeDialog();return;}if(e.key==='Tab'&&$('.dialog')){const nodes=$$('.dialog button:not([disabled]),.dialog input,.dialog textarea,.dialog select,.dialog [tabindex="0"]');const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229&&!window.matchMedia('(pointer:coarse)').matches&&['home-question','chat-input'].includes(e.target.id)){e.preventDefault();e.target.closest('form').requestSubmit()}});
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY&&!$('.dialog')&&!['chat','admin'].includes(view)){state=load();if(!state.profile)view='onboarding';render()}});
if(state.profile)chooseGreeting();render();
